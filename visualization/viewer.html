<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>App 探索图谱 · auto-explore</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--text:#17212e;--muted:#627081;--border:#dbe2e8;--accent:#176b59;--soft:#e7f3ef;--edge:#8b99a8;--warning:#9b5b11;--warnbg:#fff4e2;--selected:#e7f3ef;--danger:#a63232}
@media(prefers-color-scheme:dark){:root{--bg:#11171e;--panel:#19222c;--text:#e7edf4;--muted:#a9b7c5;--border:#344252;--accent:#80d7ba;--soft:#223e36;--edge:#899eaf;--warning:#f0c083;--warnbg:#3a2b1a;--selected:#223e36;--danger:#f4a3a3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,select{font:inherit;color:inherit}button,select,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button{border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:8px 13px}button[aria-pressed=true]{background:var(--accent);color:var(--panel);border-color:var(--accent)}a{color:var(--accent)}header{padding:25px 32px 18px;border-bottom:1px solid var(--border);background:var(--panel)}.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--muted)}h1{font-size:25px;font-weight:600;letter-spacing:-.5px;margin:4px 0 4px}h2{font-size:17px;margin:0 0 12px;font-weight:600}h3{font-size:14px;margin:20px 0 8px}.muted{color:var(--muted)}.topline,.toolbar,.appnav,.modes,.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.topline{justify-content:space-between;gap:20px}.appnav{margin-top:18px}.stats{gap:22px;margin-top:16px;font-size:13px}.stats strong{font-size:20px;font-weight:600;margin-right:5px;font-variant-numeric:tabular-nums}.notice{margin:0;padding:10px 32px;background:var(--warnbg);color:var(--warning);font-size:13px}.toolbar{justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border)}.modes{gap:7px}.legend{font-size:12px;color:var(--muted)}main{display:grid;grid-template-columns:minmax(0,1fr) 380px;max-width:1800px;margin:auto;align-items:start}.graphcol{min-width:0}.canvas{overflow:auto;min-height:490px;background-image:radial-gradient(var(--border) .7px,transparent .7px);background-size:18px 18px}.canvas svg{display:block;min-width:100%;font-family:inherit}.edge-path{stroke:var(--edge);stroke-width:1.6;fill:none}.edge-path.active{stroke:var(--accent);stroke-width:3}.edge-hit{stroke:transparent;stroke-width:20;fill:none;cursor:pointer}.edge-label{font-size:12px;fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.node{cursor:pointer}.node rect.frame{fill:var(--panel);stroke:var(--border);stroke-width:1.5}.node.active rect.frame{stroke:var(--accent);stroke-width:3}.node .title{font-size:13px;fill:var(--text);font-weight:600}.node .caption{font-size:11px;fill:var(--muted)}.node .root{fill:var(--accent);font-size:11px}.node .missing{fill:var(--muted);font-size:12px}.edges{padding:20px 24px 30px;border-top:1px solid var(--border)}.edge-list{display:grid;gap:8px}.edge-row{width:100%;text-align:left;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center}.edge-row.selected{background:var(--selected);border-color:var(--accent)}.step{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.edge-title{display:block;font-weight:500;overflow-wrap:anywhere}.edge-sub{display:block;font-size:12px;color:var(--muted)}.badge{font-size:11px;padding:3px 7px;border-radius:5px;background:var(--soft);color:var(--accent);white-space:nowrap}.badge.warning{background:var(--warnbg);color:var(--warning)}aside{border-left:1px solid var(--border);background:var(--panel);padding:24px;min-height:650px;min-width:0;position:sticky;top:0;max-height:100vh;overflow:auto}.detail-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.detail-head h2{overflow-wrap:anywhere}.shot{display:block;max-width:100%;max-height:420px;width:auto;margin:12px auto;border:1px solid var(--border);border-radius:8px;cursor:zoom-in}.emptyshot{padding:24px;text-align:center;color:var(--muted)}dl{margin:12px 0;display:grid;grid-template-columns:85px minmax(0,1fr);gap:7px;font-size:12px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:var(--bg);padding:12px;border-radius:6px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare .shot{max-height:320px;margin:6px auto}.compare figcaption{font-size:12px;color:var(--muted);text-align:center}figure{margin:0}select{width:100%;max-width:100%;padding:8px;border:1px solid var(--border);background:var(--panel);border-radius:6px}.workline{padding:7px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:start;font-size:12px}.workline span:last-child{margin-left:auto;color:var(--warning)}.hint{padding:0 24px 12px;font-size:12px;color:var(--muted)}dialog{max-width:94vw;max-height:94vh;border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text);padding:16px}dialog::backdrop{background:#0009}dialog img{display:block;max-height:80vh;max-width:87vw;margin:12px auto 0}dialog button{float:right}.warning-list{padding:12px 24px;color:var(--warning)}footer{padding:18px 32px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}code{font-size:12px;overflow-wrap:anywhere}@media(max-width:1000px){main{grid-template-columns:minmax(0,1fr) 320px}header{padding:20px}.notice{padding:10px 20px}aside{padding:18px}}@media(max-width:760px){main{display:block}aside{border-left:0;border-top:1px solid var(--border);min-height:0;position:static;max-height:none;overflow:visible}.canvas{min-height:350px}.toolbar{padding:12px 16px}.edge-row{grid-template-columns:25px minmax(0,1fr)}.edge-row .badge{grid-column:2;justify-self:start}.edges{padding:16px}.notice{font-size:12px}.shot{max-height:380px}.stats{gap:14px}.legend{width:100%}}
</style>
</head>
<body>
<header>
 <div class="topline"><div><div class="eyebrow">AUTO-EXPLORE / EXPLORATION EVIDENCE</div><h1>App 探索图谱</h1><div class="muted" id="subtitle"></div></div><a id="source-link" target="_blank" rel="noopener">查看源图谱 JSON ↗</a></div>
 <nav class="appnav" aria-label="选择 App" id="apps"></nav><div class="stats" id="stats"></div>
</header>
<p class="notice" id="notice"></p>
<main>
 <section class="graphcol" aria-label="图谱与动作">
  <div class="toolbar"><div class="modes" aria-label="图谱粒度"><button id="pages-mode" type="button" aria-pressed="true">页面图</button><button id="states-mode" type="button" aria-pressed="false">状态图</button></div><span class="legend" id="legend"></span></div>
  <div id="canvas" class="canvas"></div><p class="hint">点击节点查看截图；点击箭头或下方动作查看前后证据。箭头仅表示已记录的动作，分开的节点之间不补画恢复路径。</p>
  <section class="edges"><h2>动作记录</h2><div id="edge-list" class="edge-list"></div></section>
 </section>
 <aside id="detail" aria-live="polite" aria-label="所选节点或动作详情"></aside>
</main>
<div id="warnings" class="warning-list" hidden></div>
<footer>页面节点由原探索器判重产生；状态图只展示动作端点相关状态。控件语义和页面分类来自模型，执行成功不等于业务成功。截图已内嵌，可离线查看。</footer>
<dialog id="image-dialog"><button type="button" id="close-image">关闭大图</button><img id="large-image" alt="所选截图大图"></dialog>
<script type="application/json" id="graph-data">__GRAPH_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('graph-data').textContent);
const $=id=>document.getElementById(id);
const LABELS={click:'点击',input:'输入',swipe:'滑动',back:'返回',budget_limited:'预算受限',planning_blocked:'规划阻塞',state_unresolved:'状态未确认',recovery_failed:'恢复失败',frontier_exhausted:'当前队列耗尽',blocked:'探索阻塞',list:'列表',form:'表单',home:'首页 / 引导',detail:'内容 / 编辑',none:'无弹窗',color_picker_dialog:'颜色选择弹窗',destination_observed:'已观察到目标页面',same_page_changed:'同页面状态变化',no_visible_change:'未确认可见变化'};
const label=v=>LABELS[v]||v||'未记录';
const names={'org.tasks':'Tasks','net.gsantner.markor':'Markor','com.simplemobiletools.draw.pro':'Draw'};
let appIndex=0,mode='pages',selection=null;
const current=()=>DATA.apps[appIndex];
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function svgEl(tag,attrs,text){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs||{}))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n}
function shot(key,alt,container){if(!key||!DATA.images[key]){container.append(el('div','没有对应截图','emptyshot'));return}const image=el('img');image.className='shot';image.src=DATA.images[key];image.alt=alt;image.loading='lazy';image.addEventListener('click',()=>{$('large-image').src=image.src;$('large-image').alt=alt;$('image-dialog').showModal()});container.append(image)}
function facts(parent,items){const dl=el('dl');for(const[k,v]of items){dl.append(el('dt',k),el('dd',String(v??'未记录')))}parent.append(dl)}
function jsonBlock(parent,title,value){if(!value||!Object.keys(value).length)return;parent.append(el('h3',title),el('pre',JSON.stringify(value,null,2)))}
function topology(){const app=current();const nodes=(mode==='pages'?app.nodes:app.states).map(n=>({...n}));const edges=app.edges.map(e=>({...e,from:mode==='pages'?e.source:e.source_state,to:mode==='pages'?e.target:e.target_state}));for(const e of edges){for(const end of ['from','to']){if(!e[end])e[end]=`unobserved_${e.id}_${end}`;if(!nodes.some(n=>n.id===e[end]))nodes.push({id:e[end],page:'未确认',type:'unobserved',image:'',state:{}})}}return{nodes,edges}}
function positions(nodes,edges){const columns=Math.max(1,Math.min(4,Math.floor(($('canvas').clientWidth-40)/230)));const placed=new Map(),pending=new Set(nodes.map(n=>n.id));let rowBase=0;const preferred=mode==='pages'?current().root:edges[0]?.from;while(pending.size){const seed=pending.has(preferred)?preferred:pending.values().next().value;const levels=new Map([[seed,0]]),queue=[seed];while(queue.length){const id=queue.shift();for(const e of edges){if(e.from===id&&pending.has(e.to)&&!levels.has(e.to)){levels.set(e.to,levels.get(id)+1);queue.push(e.to)}}}const rows=new Map();for(const[id,depth]of levels){const col=depth%columns,row=(rows.get(depth)||0);rows.set(depth,row+1);placed.set(id,{x:40+col*230,y:100+(rowBase+row+Math.floor(depth/columns))*330});pending.delete(id)}rowBase+=Math.max(...rows.values())+Math.floor(Math.max(...levels.values())/columns)}return placed}
function draw(){const area=$('canvas');area.replaceChildren();const{nodes,edges}=topology(),pos=positions(nodes,edges);const width=Math.max($('canvas').clientWidth,...[...pos.values()].map(p=>p.x+240)),height=Math.max(400,...[...pos.values()].map(p=>p.y+360));const svg=svgEl('svg',{width,height,viewBox:`0 0 ${width} ${height}`,role:'img','aria-label':`${mode==='pages'?'页面':'状态'}图：${nodes.length} 个节点，${edges.length} 条动作`});const defs=svgEl('defs');for(const[id,color]of[['arrow','var(--edge)'],['arrow-active','var(--accent)']]){const m=svgEl('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});m.append(svgEl('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:color}));defs.append(m)}svg.append(defs);
const pairs=new Map();for(const e of edges){const p=pos.get(e.from),q=pos.get(e.to);if(!p||!q)continue;const key=e.from+'|'+e.to;const count=pairs.get(key)||0;pairs.set(key,count+1);const active=selection?.kind==='edge'&&selection.id===e.id;let d,lx,ly;if(e.from===e.to){const k=count*22;d=`M ${p.x+140} ${p.y+75} C ${p.x+235+k} ${p.y-70-k},${p.x-40-k} ${p.y-70-k},${p.x+35} ${p.y+75}`;lx=p.x+88;ly=p.y-17-k}else if(q.x===p.x&&q.y>p.y){d=`M ${p.x+85} ${p.y+230} C ${p.x+85} ${p.y+270},${q.x+85} ${q.y-40},${q.x+85} ${q.y}`;lx=p.x+125;ly=(p.y+230+q.y)/2}else if(q.x===p.x){const bend=45+count*20;d=`M ${p.x+170} ${p.y+110} C ${p.x+170+bend} ${p.y+110},${q.x+170+bend} ${q.y+110},${q.x+170} ${q.y+110}`;lx=p.x+208;ly=(p.y+q.y)/2+110+count*18}else if(q.x>p.x){const offset=(count-0.5)*22;d=`M ${p.x+170} ${p.y+110} C ${p.x+215} ${p.y+110+offset},${q.x-45} ${q.y+110+offset},${q.x} ${q.y+110}`;lx=(p.x+170+q.x)/2;ly=(p.y+q.y)/2+95+offset}else{const bend=35+count*25;d=`M ${p.x+85} ${p.y+230} C ${p.x+85} ${Math.max(p.y,q.y)+265+bend},${q.x+85} ${Math.max(p.y,q.y)+265+bend},${q.x+85} ${q.y+230}`;lx=(p.x+q.x)/2+85;ly=Math.max(p.y,q.y)+267+bend}const path=svgEl('path',{d,class:'edge-path'+(active?' active':''),'marker-end':`url(#${active?'arrow-active':'arrow'})`});const hit=svgEl('path',{d,class:'edge-hit'});hit.addEventListener('click',()=>chooseEdge(e.id));svg.append(path,hit,svgEl('text',{x:lx,y:ly,'text-anchor':'middle',class:'edge-label'},`${e.index} · ${label(e.action)}`))}
for(const n of nodes){const p=pos.get(n.id);const group=svgEl('g',{transform:`translate(${p.x},${p.y})`,class:'node'+(selection?.kind==='node'&&selection.id===n.id?' active':''),role:'button',tabindex:0,'aria-label':`查看 ${n.id} 截图与状态`});group.append(svgEl('rect',{width:170,height:230,rx:10,class:'frame'}));if(n.image&&DATA.images[n.image])group.append(svgEl('image',{href:DATA.images[n.image],x:35,y:10,width:100,height:170,preserveAspectRatio:'xMidYMid meet'}));else group.append(svgEl('text',{x:85,y:95,'text-anchor':'middle',class:'missing'},'无截图'));group.append(svgEl('text',{x:12,y:200,class:'title'},n.id),svgEl('text',{x:12,y:219,class:'caption'},mode==='pages'?`${label(n.type)} · ${n.variants?.length||0} 个观测状态`:`${n.page} · ${label(n.state?.overlay)}`));if(mode==='pages'&&n.id===current().root)group.append(svgEl('text',{x:158,y:25,'text-anchor':'end',class:'root'},'起点'));group.addEventListener('click',()=>chooseNode(n.id));group.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseNode(n.id)}});svg.append(group)}area.append(svg);$('legend').textContent=mode==='pages'?'同页动作显示为回环；数字为动作顺序':`展示 ${current().states.length} 个动作相关状态 / 共 ${current().all_state_count} 个观测状态`}
function edgeList(){const box=$('edge-list');box.replaceChildren();for(const e of current().edges){const button=el('button',undefined,'edge-row'+(selection?.kind==='edge'&&selection.id===e.id?' selected':''));button.type='button';button.append(el('span',String(e.index).padStart(2,'0'),'step'));const text=el('span');text.append(el('span',`${label(e.action)} · ${e.text||e.description||'未标注目标'}`,'edge-title'),el('span',`${e.source||'未确认'} → ${e.target||'未确认'} · ${label(e.outcome)}`,'edge-sub'));button.append(text,el('span',e.success===true?'执行成功':e.success===false?'执行失败':'执行未确认','badge'+(e.success===true?'':' warning')));button.addEventListener('click',()=>chooseEdge(e.id));box.append(button)}if(!current().edges.length)box.append(el('p','没有已记录的转移','muted'))}
function chooseNode(id){selection={kind:'node',id};draw();edgeList();const n=topology().nodes.find(n=>n.id===id);const box=$('detail');box.replaceChildren();if(!n)return;box.append(el('h2',n.id),el('div',n.description||`${n.page} · ${label(n.type)}`,'muted'));facts(box,[['所属页面',n.page],['Activity',n.activity||'未记录']]);if(mode==='pages'&&n.variants?.length){const labelNode=el('label','观测截图');const select=el('select');select.setAttribute('aria-label','选择页面观测截图');const rep=el('option','页面代表截图');rep.value='';select.append(rep);for(const state of n.variants){const opt=el('option',`${state.id} · ${label(state.state.overlay)}`);opt.value=state.id;select.append(opt)}const holder=el('div');shot(n.image,n.id,holder);select.addEventListener('change',()=>{holder.replaceChildren();const s=n.variants.find(s=>s.id===select.value);shot(s?s.image:n.image,s?s.id:n.id,holder);const extra=$('variant-data');extra.replaceChildren();if(s){jsonBlock(extra,'行为状态',s.state);jsonBlock(extra,'可见值',s.values)}});labelNode.append(select);box.append(labelNode,holder);const extra=el('div');extra.id='variant-data';box.append(extra);if(n.work?.length){box.append(el('h3','探索工作项'));for(const w of n.work){const line=el('div',undefined,'workline');line.append(el('code',w.id),el('span',w.module),el('span',label(w.status)));box.append(line)}}}else{shot(n.image,n.id,box);jsonBlock(box,'行为状态',n.state);jsonBlock(box,'可见值',n.values);jsonBlock(box,'上下文',n.context)}}
function chooseEdge(id){selection={kind:'edge',id};draw();edgeList();const e=current().edges.find(e=>e.id===id);const box=$('detail');box.replaceChildren();if(!e)return;box.append(el('h2',`动作 ${e.index} · ${label(e.action)}`),el('p',e.description||e.text||'未记录动作描述'));facts(box,[['页面',`${e.source||'未确认'} → ${e.target||'未确认'}`],['状态',`${e.source_state||'未记录'} → ${e.target_state||'未记录'}`],['执行结果',e.success===true?'ADB 命令执行成功':e.success===false?'执行失败':'未知'],['到达验证',e.verified===true?'已确认':e.verified===false?'未确认':'未记录'],['业务成功',e.business_success===true?'已确认':e.business_success===false?'未成功':'未知'],['观测结果',label(e.outcome)]]);if(e.error)box.append(el('pre',e.error));const comparison=el('div',undefined,'compare');for(const[key,title]of[['before','动作前'],['after','动作后']]){const fig=el('figure');fig.append(el('figcaption',title));shot(e[key],`动作 ${e.index} ${title}`,fig);comparison.append(fig)}box.append(comparison)}
function renderApp(index){appIndex=index;const app=current();$('apps').replaceChildren();DATA.apps.forEach((a,i)=>{const button=el('button',names[a.package]||a.name);button.type='button';button.setAttribute('aria-pressed',String(i===index));button.addEventListener('click',()=>renderApp(i));$('apps').append(button)});$('subtitle').textContent=app.package;$('source-link').href=app.source;$('stats').replaceChildren();for(const[num,text]of[[app.nodes.length,'页面'],[app.all_state_count,'观测状态'],[app.edges.length,'动作']]){const span=el('span');span.append(el('strong',String(num)),document.createTextNode(text));$('stats').append(span)}$('notice').textContent=`本轮终止：${label(app.termination)} · 已完成 ${app.steps} 步。短程结果不代表完整功能覆盖；工作项仍可能存在规划阻塞或状态未确认。`;$('pages-mode').setAttribute('aria-pressed',String(mode==='pages'));$('states-mode').setAttribute('aria-pressed',String(mode==='states'));const nodes=topology().nodes;chooseNode(nodes.find(n=>n.id===app.root)?.id||nodes[0]?.id)}
$('pages-mode').addEventListener('click',()=>{mode='pages';renderApp(appIndex)});$('states-mode').addEventListener('click',()=>{mode='states';renderApp(appIndex)});$('close-image').addEventListener('click',()=>$('image-dialog').close());if(DATA.warnings.length){$('warnings').hidden=false;$('warnings').textContent=`截图提示：${DATA.warnings.join('；')}`}renderApp(0);window.addEventListener('resize',()=>draw());
</script>
</body>
</html>
